<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UNS Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">UNS Dashboard</a>
        </div>
        <ul class="nav-links">
            <li><a href="/pages/deliveries/" class="{% if 'deliveries' in request.url.path %}active{% endif %}">Deliveries</a></li>
            <li><a href="/pages/policies/">Policies</a></li>
            <li><a href="/pages/invariants/">Invariants</a></li>
            <li><a href="/pages/audit/">Audit</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>UNS Dashboard - Read-Only View | <span class="version">v0.1.0</span></p>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
