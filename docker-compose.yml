# AGSignal local development stack.
#
# Spins up:
#   - postgres (data persisted in named volume)
#   - redis (data persisted in named volume)
#   - agsignal: unified AGSignal HTTP service (Core write + Console read on 127.0.0.1:8000)
#
# Phase 3 unified the two FastAPI apps; reintroduce a split via reverse-proxy
# routing if needed for production.
#
# AGSignal binds to 127.0.0.1 on the host. NOT FOR PRODUCTION — see
# docs/DEPLOYMENT.md for the production recipe (reverse proxy, TLS, real
# secret management, restricted /metrics network exposure, etc.).
#
# Usage:
#   docker compose up --build              # first run: builds image + creates schema
#   docker compose up                      # subsequent runs
#
# After the first successful start, edit the AGSIGNAL_CREATE_TABLES line below
# to "false" so subsequent boots do not attempt schema creation.

name: agsignal-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agsignal
      POSTGRES_PASSWORD: agsignal-dev-only
      POSTGRES_DB: agsignal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agsignal -d agsignal"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agsignal-db:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - agsignal-redis:/data
    restart: unless-stopped

  agsignal:
    build: .
    image: agsignal:dev
    environment:
      DATABASE_URL: postgresql+psycopg2://agsignal:agsignal-dev-only@db:5432/agsignal
      AGSIGNAL_REDIS_URL: redis://redis:6379/0
      AGSIGNAL_API_KEY: dev-only-key-rotate-before-real-use
      AGSIGNAL_API_PRINCIPAL: dev-operator
      AGSIGNAL_HOST: 0.0.0.0
      AGSIGNAL_CREATE_TABLES: "true"   # FIRST RUN ONLY — flip to "false" after schema exists
      AGSIGNAL_ENABLE_DOCS: "true"     # /docs visible in dev only — never in production
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 30                       # generous so first-run schema creation finishes
      start_period: 15s
    restart: unless-stopped

volumes:
  agsignal-db:
  agsignal-redis:
