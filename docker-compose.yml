# AGSignal local development stack.
#
# Spins up:
#   - postgres (data persisted in named volume)
#   - redis (data persisted in named volume)
#   - core: AGSignal Core (write API on 127.0.0.1:8000)
#   - console: AGSignal Console (read API on 127.0.0.1:8001)
#
# Both AGSignal services bind to 127.0.0.1 on the host. NOT FOR PRODUCTION —
# see docs/DEPLOYMENT.md for the production recipe (reverse proxy, TLS, real
# secret management, restricted /metrics network exposure, etc.).
#
# Usage:
#   docker compose up --build              # first run: builds image + creates schema
#   docker compose up                      # subsequent runs
#
# After the first successful start, edit the AGSIGNAL_CREATE_TABLES line below
# to "false" so subsequent boots do not attempt schema creation.

name: agsignal-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agsignal
      POSTGRES_PASSWORD: agsignal-dev-only
      POSTGRES_DB: agsignal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agsignal -d agsignal"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agsignal-db:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - agsignal-redis:/data
    restart: unless-stopped

  core:
    build: .
    image: agsignal:dev
    environment:
      DATABASE_URL: postgresql+psycopg2://agsignal:agsignal-dev-only@db:5432/agsignal
      AGSIGNAL_REDIS_URL: redis://redis:6379/0
      AGSIGNAL_API_KEY: dev-only-key-rotate-before-real-use
      AGSIGNAL_API_PRINCIPAL: dev-operator
      AGSIGNAL_HOST: 0.0.0.0
      AGSIGNAL_CREATE_TABLES: "true"   # FIRST RUN ONLY — flip to "false" after schema exists
      AGSIGNAL_ENABLE_DOCS: "true"     # /docs visible in dev only — never in production
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 30                       # generous so first-run schema creation finishes
      start_period: 15s
    restart: unless-stopped

  console:
    image: agsignal:dev
    command: ["uvicorn", "mcp_server.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE_URL: postgresql+psycopg2://agsignal:agsignal-dev-only@db:5432/agsignal
      AGSIGNAL_API_KEY: dev-only-key-rotate-before-real-use
      AGSIGNAL_API_PRINCIPAL: dev-operator
      AGSIGNAL_ENABLE_DOCS: "true"
      AGSIGNAL_CREATE_TABLES: "true"   # FIRST RUN ONLY — Console bootstraps the SQLAlchemy schema; flip to "false" once tables exist
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      # Override the Dockerfile default (which probes :8000) so Console's
      # 8001 listener is what the healthcheck actually hits.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  agsignal-db:
  agsignal-redis:
