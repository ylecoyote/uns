# UNS local development stack.
#
# Spins up:
#   - postgres (data persisted in named volume)
#   - redis (data persisted in named volume)
#   - uns: unified UNS HTTP service (Core write + Console read on 127.0.0.1:8000)
#
# Phase 3 unified the two FastAPI apps; reintroduce a split via reverse-proxy
# routing if needed for production.
#
# UNS binds to 127.0.0.1 on the host. NOT FOR PRODUCTION — see
# docs/DEPLOYMENT.md for the production recipe (reverse proxy, TLS, real
# secret management, restricted /metrics network exposure, etc.).
#
# Usage:
#   docker compose up --build              # first run: builds image + creates schema
#   docker compose up                      # subsequent runs
#
# After the first successful start, edit the UNS_CREATE_TABLES line below
# to "false" so subsequent boots do not attempt schema creation.

name: uns-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uns
      POSTGRES_PASSWORD: uns-dev-only
      POSTGRES_DB: uns
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uns -d uns"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - uns-db:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - uns-redis:/data
    restart: unless-stopped

  uns:
    build: .
    image: uns:dev
    environment:
      DATABASE_URL: postgresql+psycopg2://uns:uns-dev-only@db:5432/uns
      UNS_REDIS_URL: redis://redis:6379/0
      UNS_API_KEY: dev-only-key-rotate-before-real-use
      UNS_API_PRINCIPAL: dev-operator
      UNS_HOST: 0.0.0.0
      UNS_CREATE_TABLES: "true"   # FIRST RUN ONLY — flip to "false" after schema exists
      UNS_ENABLE_DOCS: "true"     # /docs visible in dev only — never in production
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import json, os, urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/readyz', headers={'Authorization': 'Bearer ' + os.environ['UNS_API_KEY']}); result=json.load(urllib.request.urlopen(r, timeout=2)); raise SystemExit(0 if result['status']=='ready' else 1)"
      interval: 10s
      timeout: 3s
      retries: 30                       # generous so first-run schema creation finishes
      start_period: 15s
    restart: unless-stopped

volumes:
  uns-db:
  uns-redis:
