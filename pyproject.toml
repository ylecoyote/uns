[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agsignal"
version = "0.1.0"
description = "AGSignal - Control-plane governance signaling infrastructure for autonomous agent systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["notifications", "alerts", "messaging", "mcp", "governance", "audit", "agents"]
authors = [
    {name = "AGSignal Maintainers"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Typing :: Typed",
]
dependencies = [
    "google-re2>=1.1.20251105",
    # Core SDK only needs the data model + YAML policy loader. Everything
    # else (HTTP, persistence, channel adapters, MCP) is opt-in via extras.
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
# HTTP runtime: needed to run AGSignal Core / AGSignal Console FastAPI apps.
# Includes the Prometheus exposition layer and the slowapi-backed rate limiter.
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20.0",
]
# Production storage backend for idempotency, dedup, DLQ, rate-limit shared state.
redis = [
    "redis>=5.0.0",
]
# SQLAlchemy-backed audit / policy / replay stores.
sql = [
    "sqlalchemy>=2.0",
]
# MCP server transports (FastMCP + stdio).
mcp = [
    "mcp[cli]>=1.0.0",
]
# HTTP-based channel adapters (Slack, PagerDuty webhooks).
adapters = [
    "httpx>=0.25.0",
]
# Everything an operator needs to self-host both apps end-to-end.
full = [
    "agsignal[server,redis,sql,mcp,adapters]",
]
# Test + lint + security tooling. Pulls in [full] so every code path is reachable.
dev = [
    "agsignal[full]",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "fakeredis>=2.20.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "bandit>=1.8.0",
    "pip-audit>=2.9.0",
]
# Backwards-compatible alias for legacy install instructions.
all = [
    "agsignal[full,dev]",
]

[project.scripts]
agsignal = "agsignal.app:main"

[project.urls]
Homepage = "https://github.com/ylecoyote/agsignal"
Repository = "https://github.com/ylecoyote/agsignal"
Issues = "https://github.com/ylecoyote/agsignal/issues"
Changelog = "https://github.com/ylecoyote/agsignal/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ylecoyote/agsignal#readme"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agsignal*", "agsignal_mcp*", "notification*", "db*", "ui_client*"]

[tool.setuptools.package-data]
# Ship PEP 561 type-information markers in every package so downstream
# type checkers (mypy, pyright) honor inline annotations.
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/ui/tests"]
pythonpath = [".", "src", "apps"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "integration: marks integration tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ARG001", # unused function argument
    "ARG002", # unused method argument
    "B905",   # zip without explicit strict
    "SIM108", # use ternary operator instead of if-else
]

[tool.ruff.lint.isort]
known-first-party = ["agsignal", "notification", "db", "apps"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
