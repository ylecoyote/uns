[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uns"
version = "0.6.1"
description = "UNS - Unified Notification Service for durable human-response coordination in agent workflows, immutable policy provenance, and opt-in approval obligation bridges"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["notifications", "alerts", "messaging", "mcp", "governance", "audit", "agents"]
authors = [
    {name = "UNS Maintainers"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Typing :: Typed",
]
dependencies = [
    "google-re2>=1.1.20251105,<2",
    # Core SDK only needs the data model + YAML policy loader. Everything
    # else (HTTP, persistence, channel adapters, MCP) is opt-in via extras.
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
# HTTP runtime: needed to run UNS Core / UNS Console FastAPI apps.
# Includes the Prometheus exposition layer and the slowapi-backed rate limiter.
server = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.26.0",
]
# Production storage backend for idempotency, dedup, DLQ, rate-limit shared state.
redis = [
    "redis>=8.1.0",
]
# SQLAlchemy-backed audit / policy / replay stores.
sql = [
    "sqlalchemy>=2.1.6",
    "psycopg[binary]>=3.3.7",
]
# MCP server transports (FastMCP + stdio).
mcp = [
    "mcp[cli]>=1.30.0,<2",
]
# HTTP-based channel adapters (Slack, PagerDuty webhooks).
adapters = [
    "httpx>=0.28.1",
]
# Everything an operator needs to self-host both apps end-to-end.
full = [
    "uns[server,redis,sql,mcp,adapters]",
]
# Test + lint + security tooling. Pulls in [full] so every code path is reachable.
dev = [
    "uns[full]",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=4.1.0",
    "fakeredis>=2.20.0",
    "ruff>=0.17.3",
    "mypy>=1.5.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]
# Documentation build tooling.
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocs-callouts>=1.12.0",
]
# Backwards-compatible alias for legacy install instructions.
all = [
    "uns[full,dev]",
]

[project.scripts]
uns = "uns.app:main"
uns-migrate = "uns.migrate:main"
uns-maintain = "uns.maintenance:main"
uns-slo-certify = "uns.slo:main"
uns-mcp = "uns_mcp.transports.stdio:main"

[project.urls]
Homepage = "https://github.com/ylecoyote/uns"
Repository = "https://github.com/ylecoyote/uns"
Issues = "https://github.com/ylecoyote/uns/issues"
Changelog = "https://github.com/ylecoyote/uns/blob/main/CHANGELOG.md"
Documentation = "https://ylecoyote.github.io/uns/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["uns*", "uns_mcp*", "notification*", "db*", "ui_client*"]

[tool.setuptools.package-data]
# Ship PEP 561 type-information markers and packaged invariant catalog in every
# package so downstream type checkers and wheel installs have complete metadata.
"*" = ["py.typed", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/ui/tests"]
pythonpath = [".", "src", "apps"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "integration: marks integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ARG001", # unused function argument
    "ARG002", # unused method argument
    "B905",   # zip without explicit strict
    "SIM108", # use ternary operator instead of if-else
    "UP042",  # keep (str, Enum) subclasses for stable str()/Pydantic behavior
]

[tool.ruff.lint.isort]
known-first-party = ["uns", "uns_mcp", "notification", "db", "apps"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
plugins = ["pydantic.mypy"]
