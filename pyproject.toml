[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-notification-service"
version = "0.1.0"
description = "Unified Notification Service (UNS) - Control-plane notification and acknowledgment service for autonomous agent systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["notifications", "alerts", "messaging"]
authors = [
    {name = "UNS Team"}
]
dependencies = [
    "pydantic>=2.0.0",
    "redis>=5.0.0",
    "rq>=1.15.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlalchemy>=2.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
adapters = [
    "httpx>=0.25.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "fakeredis>=2.20.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
all = [
    "unified-notification-service[adapters,dev]",
]

[tool.setuptools.packages.find]
where = ["src", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/ui/tests"]
pythonpath = [".", "src", "apps"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ARG001", # unused function argument
    "ARG002", # unused method argument
    "B905",   # zip without explicit strict
    "SIM108", # use ternary operator instead of if-else
]

[tool.ruff.lint.isort]
known-first-party = ["notification", "mcp_server", "db", "apps"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
