tasks:
  - title: "Baseline review: compare UNS docs to Functional + Technical Specs"
    completed: true
    description: |
      Review README.md, ARCHITECTURE.md, API.md, and CHANGELOG.md against:
      - Functional Spec v2.0
      - Technical Spec v2.0

      Produce a gap list containing:
      - contradictions (doc says X, spec says Y)
      - omissions (spec requires X, docs don’t mention it)
      - ambiguity (docs could be misread to imply forbidden behavior)
      - unclear operational ownership (policies, deployment, health)

      Include file + section references for each item.
      Do not infer intent beyond specs or code.

      Output:
      - docs/reports/doc-alignment-summary.md
  - title: Create doc change plan from gap report
    completed: true
    description: |
      Turn the baseline gap list into an ordered doc update plan:
      - which files will change
      - what sections will be added/edited
      - expected outputs for each change

      Output:
      - docs/reports/doc-update-plan.md
  - title: Document notification policy lifecycle and operational usage
    completed: true
    parallel_group: 1
    description: |
      Add/extend documentation describing:
      - policy states: DRAFT, PREVIEW, ACTIVE, RETIRED
      - how policies are loaded, versioned, hashed, and applied
      - precedence: policy overrides vs SDK defaults
      - behavior when policy registry is unavailable (safe fallbacks)

      Output:
      - docs/sections/policy-lifecycle.md (or equivalent section in README)
  - title: Clarify standalone UNS vs ATP-integrated operation
    completed: true
    parallel_group: 1
    description: >
      Update documentation to explicitly separate:

      - UNS core (ATP-agnostic)

      - integrations (ATP-only components, websocket manager assumptions)


      Ensure a reader cannot conclude UNS requires ATP to function.


      Output:

      - docs/sections/integration-modes.md (or equivalent updates in
      ARCHITECTURE.md)
  - title: Add explicit acknowledgment safety guardrails to documentation
    completed: true
    parallel_group: 1
    description: >
      Strengthen doc language to prevent misuse:

      - acknowledgments may gate autonomy state transitions ONLY

      - acknowledgments must NEVER block execution loops / order routing / risk
      unwind

      - include a clear “anti-pattern” warning


      Ensure examples cannot be interpreted as execution gating.


      Output:

      - README.md updates (and/or ARCHITECTURE.md warning box)
  - title: Add delivery semantics truth table to documentation
    completed: true
    parallel_group: 1
    description: |
      Create a concise truth table covering:
      - intent × delivery_mode × autonomy_mode → channels + behavior
      - GUARANTEED: sequential fallback and escalation rules
      - BEST_EFFORT: failure tolerance rules
      - DLQ visibility/degradation invariants

      Output:
      - docs/sections/delivery-semantics.md
  - title: Document observability, health signals, and degradation behavior
    completed: true
    parallel_group: 1
    description: >
      Add documentation describing:

      - what “degraded” means for UNS

      - DLQ visibility rules and operator impact

      - key metrics and their intent (latency, retries, DLQ depth, ack timeout
      counts)

      - any /health endpoint semantics if present (or explicitly note if not
      implemented)


      Output:

      - docs/sections/observability.md
  - title: Integrate doc sections into README/ARCHITECTURE/API as appropriate
    completed: true
    description: >
      Ensure newly created sections are linked and discoverable.

      Consolidate duplication and avoid conflicting statements across files.


      Outputs:

      - updated docs/README.md

      - updated docs/ARCHITECTURE.md

      - updated docs/API.md (if any behavior/contract clarifications are
      required)
  - title: Final consistency + misuse audit across all documentation
    completed: true
    description: >
      Perform a final pass to ensure:

      - no contradictions with functional/technical specs

      - no example implies forbidden behavior (especially ack/execution
      boundary)

      - guarantees are explicitly scoped (no “infinite retry” implications)

      - policy ownership and fallback behavior are unambiguous


      Output:

      - docs/reports/final-doc-audit.md
  - title: Produce final “docs-as-contract” success checklist
    completed: true
    description: >
      Create a short checklist that a reviewer can use to validate docs remain
      correct over time:

      - intent routing described

      - delivery semantics described

      - ack rules and boundaries stated

      - policy lifecycle described

      - observability/degradation documented


      Output:

      - docs/reports/docs-contract-checklist.md
