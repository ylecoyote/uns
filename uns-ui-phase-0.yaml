tasks:
  - title: Define UI scope and non-goals for Phase 0-2
    completed: true
    description: |
      Create a short UI scope doc stating:
      - UI is read-first "flight instruments", not a control cockpit
      - No notification authoring in v1
      - No policy editing in v1
      - UI must not bypass invariants
      Output:
      - docs/ui/ui-scope.md
  - title: Define read-only UI data contracts (delivery, policy, invariants, audit)
    completed: true
    description: |
      Define response shapes, filters, pagination, and error semantics for:
      - Delivery timeline + attempts
      - Escalations + failures
      - Effective policy resolution trace
      - Invariant registry rendering
      - Audit event stream
      Output:
      - docs/ui/ui-data-contracts.md
  - title: Add API endpoints skeleton for UI read models
    completed: true
    parallel_group: 1
    description: >
      Implement or stub read-only endpoints (no mutating actions) consistent
      with ui-data-contracts:

      - GET /ui/deliveries?filters...

      - GET /ui/deliveries/{id}

      - GET /ui/policies/effective?notification_type=...

      - GET /ui/invariants

      - GET /ui/audit?filters...

      Ensure auth/permissions are read-only.

      Output:

      - src/... updated with endpoints (or stubs)

      - docs/API.md updated with these endpoints
  - title: Implement storage/query adapters for UI read endpoints
    completed: true
    parallel_group: 1
    description: >
      Wire endpoints to existing persistence/logging/audit stores.

      If no persistence exists, implement minimal in-memory or file-backed
      adapter

      suitable for local demo and clearly document limitations.

      Output:

      - src/... read model adapters

      - docs/ui/ui-read-models.md
  - title: Add test coverage for UI read endpoints
    completed: true
    parallel_group: 2
    description: |
      Add unit/integration tests for:
      - filtering and pagination
      - authorization boundaries (read-only)
      - correct mapping of delivery attempts/escalations to response shapes
      Output:
      - tests/... new/updated
  - title: Add observability for UI endpoints
    completed: true
    description: |
      Ensure UI endpoints emit:
      - request metrics
      - error metrics
      - structured logs with request ids
      Document dashboards/queries if applicable.
      Output:
      - docs/ui/ui-observability.md
      - src/... instrumentation updates
  - title: Produce Phase 0 verification report (bounded)
    completed: true
    description: |
      Run bounded verification across docs + code changes:
      - endpoints match docs
      - no mutating actions introduced
      - invariants remain enforced
      Output:
      - docs/reports/ui/phase-0-verify.md
