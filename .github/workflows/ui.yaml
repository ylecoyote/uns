name: UI CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/ui/**'
      - 'scripts/ci/check_ui_boundary.py'
      - '.github/workflows/ui.yaml'
  pull_request:
    paths:
      - 'apps/ui/**'
      - 'scripts/ci/check_ui_boundary.py'
      - '.github/workflows/ui.yaml'

jobs:
  boundary-check:
    name: UI Boundary Guardrail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run UI boundary check
        id: boundary_check
        run: |
          echo "::group::UI Boundary Guardrail Check"
          python scripts/ci/check_ui_boundary.py --strict
          echo "::endgroup::"

      - name: Report violations (on failure)
        if: failure()
        run: |
          echo "## UI Boundary Violations Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The UI boundary guardrail detected violations." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rules" >> $GITHUB_STEP_SUMMARY
          echo "1. No Python files in \`apps/ui/**\` (except \`apps/ui/legacy_flask_reference/**\`)" >> $GITHUB_STEP_SUMMARY
          echo "2. No \`templates/\` directories in \`apps/ui/**\`" >> $GITHUB_STEP_SUMMARY
          echo "3. No Flask patterns in \`apps/ui/app.py\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to Fix" >> $GITHUB_STEP_SUMMARY
          echo "Run \`python scripts/ci/check_ui_boundary.py --fix\` for migration guidance." >> $GITHUB_STEP_SUMMARY

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run type-check

  test:
    name: Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  build:
    name: Vite Build
    runs-on: ubuntu-latest
    needs: [boundary-check, lint, typecheck, test]
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: apps/ui/dist
          retention-days: 7
