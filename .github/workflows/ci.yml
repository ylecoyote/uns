name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests, Lint & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Run Ruff lint
        run: ruff check src tests scripts apps

      - name: Run Mypy typecheck
        run: mypy -p uns -p agsignal -p notification -p db -p ui_client -p agsignal_mcp

      - name: Run Bandit security scan
        run: bandit -q -r src

      - name: Verify UI boundary isolation
        run: python scripts/ci/check_ui_boundary.py

      - name: Run Pytest suite
        run: pytest -q tests apps/ui/tests

  ui:
    name: Operator Console Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Run UI tests
        run: npm test -- --run

      - name: Build UI bundle
        run: npm run build
