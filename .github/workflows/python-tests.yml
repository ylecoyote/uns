name: Python CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install package
        run: uv pip install --system -e ".[dev]"

      - name: Run ruff
        run: uv run ruff check src tests scripts apps

      - name: Run Bandit
        run: uv run bandit -q -r src

      - name: Run pip-audit
        run: uv run pip-audit --cache-dir /tmp/pip-audit-cache .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install package
        run: uv pip install --system -e ".[dev]"

      - name: Run Python tests
        run: >
          uv run pytest tests apps/ui/tests --tb=short
          --cov=src/agsignal
          --cov=src/notification
          --cov=src/db
          --cov=src/agsignal_mcp
          --cov-report=term
          --cov-fail-under=75

  install-smoke:
    name: Clean-room wheel install
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: uv build

      # ---------- Minimal install: SDK-only consumer ----------
      - name: Create isolated venv (minimal install — no extras)
        run: uv venv --python 3.12 /tmp/sdk-only

      - name: Install wheel with NO extras
        run: uv pip install --python /tmp/sdk-only/bin/python dist/agsignal-*.whl

      - name: Confirm minimal install ships only the SDK and core domain types
        run: |
          /tmp/sdk-only/bin/python <<'PYEOF'
          # Public SDK surface must work without any extras installed.
          import agsignal
          import agsignal_mcp  # must succeed via PEP 562 without [mcp]
          from agsignal import (
              SignalClient, GovernanceSignal, SignalIntent,
              AutonomyMode, AutonomyContext, Channel,
          )
          from agsignal_mcp import MCPRuntimeConfig
          assert MCPRuntimeConfig().read_only is True, "read_only must default True"
          # Server modules MUST raise ImportError without the [server] extra.
          # This is the contract — minimal install does not pull in fastapi.
          for module in ("notification.main", "mcp_server.app", "notification.routes"):
              try:
                  __import__(module)
              except ModuleNotFoundError:
                  pass
              else:
                  raise SystemExit(f"FAIL: {module} importable without [server] extra")
          print("Minimal install: SDK works, server modules correctly absent")
          PYEOF

      - name: Confirm dev/test deps did NOT leak into the minimal install
        run: |
          /tmp/sdk-only/bin/python <<'PYEOF'
          for mod in (
              "pytest", "bandit", "pip_audit", "ruff", "mypy",
              "fastapi", "uvicorn", "sqlalchemy", "redis", "slowapi",
              "prometheus_client", "mcp",
          ):
              try:
                  __import__(mod)
                  raise SystemExit(f"FAIL: {mod} leaked into minimal install")
              except ImportError:
                  pass
          print("Minimal install footprint clean")
          PYEOF

      # ---------- Full install: self-hoster ----------
      - name: Create isolated venv (full install)
        run: uv venv --python 3.12 /tmp/full-install

      - name: Install wheel with [full] extra
        run: |
          uv pip install --python /tmp/full-install/bin/python \
              --find-links dist "agsignal[full]"

      - name: Confirm full install lights up every shipped package
        run: |
          /tmp/full-install/bin/python <<'PYEOF'
          import agsignal
          import agsignal_mcp
          import notification
          import db
          import mcp_server
          import ui_client
          from notification.main import create_app as create_core
          from mcp_server.app import create_app as create_console
          from agsignal_mcp import create_mcp_server
          # Construct both apps to make sure all dependency wiring resolves.
          core = create_core()
          console = create_console(skip_persistence_config=True)
          assert core.title == "AGSignal Core"
          assert console.title == "AGSignal Console API"
          print("Full install: all server entrypoints construct cleanly")
          PYEOF

  ci:
    name: CI
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, test, install-smoke]
    steps:
      - name: Verify all required jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint and Audit job failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test job (matrix) failed"
            exit 1
          fi
          if [ "${{ needs.install-smoke.result }}" != "success" ]; then
            echo "Clean-room wheel install job failed"
            exit 1
          fi
          echo "All required jobs passed"
