name: Python CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install package
        run: uv pip install --system -e ".[dev]"

      - name: Run ruff
        run: uv run ruff check src tests scripts apps

      - name: Run mypy
        run: uv run mypy -p uns -p notification -p db -p ui_client -p uns_mcp

      - name: Run Bandit
        run: uv run bandit -q -r src

      - name: Run pip-audit
        run: uv run pip-audit --cache-dir /tmp/pip-audit-cache .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install package
        run: uv pip install --system -e ".[dev]"

      - name: Run Python tests
        run: >
          uv run pytest tests --tb=short
          --cov=src/uns
          --cov=src/notification
          --cov=src/db
          --cov=src/uns_mcp
          --cov-report=term
          --cov-fail-under=75

  install-smoke:
    name: Clean-room wheel install
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheel and sdist
        run: uv build

      # ---------- Minimal install: SDK-only consumer ----------
      - name: Create isolated venv (minimal install — no extras)
        run: uv venv --python 3.12 /tmp/sdk-only

      - name: Install wheel with NO extras
        run: uv pip install --python /tmp/sdk-only/bin/python dist/uns-*.whl

      - name: Confirm minimal install ships only the SDK and core domain types
        run: |
          /tmp/sdk-only/bin/python <<'PYEOF'
          # Public SDK surface must work without any extras installed.
          import uns
          import uns_mcp  # must succeed via PEP 562 without [mcp]
          from uns import (
              SignalClient, GovernanceSignal, SignalIntent,
              AutonomyMode, AutonomyContext, Channel,
          )
          from uns_mcp import MCPRuntimeConfig
          assert MCPRuntimeConfig().read_only is True, "read_only must default True"
          # Server modules MUST raise ImportError without the [server] extra.
          # This is the contract — minimal install does not pull in fastapi.
          for module in ("notification.routes",):
              try:
                  __import__(module)
              except ModuleNotFoundError:
                  pass
              else:
                  raise SystemExit(f"FAIL: {module} importable without [server] extra")
          print("Minimal install: SDK works, server modules correctly absent")
          PYEOF

      - name: Confirm dev/test deps did NOT leak into the minimal install
        run: |
          /tmp/sdk-only/bin/python <<'PYEOF'
          for mod in (
              "pytest", "bandit", "pip_audit", "ruff", "mypy",
              "fastapi", "uvicorn", "sqlalchemy", "redis", "slowapi",
              "prometheus_client", "mcp",
          ):
              try:
                  __import__(mod)
                  raise SystemExit(f"FAIL: {mod} leaked into minimal install")
              except ImportError:
                  pass
          print("Minimal install footprint clean")
          PYEOF

      # ---------- Full install: self-hoster ----------
      - name: Create isolated venv (full install)
        run: uv venv --python 3.12 /tmp/full-install

      - name: Install wheel with [full] extra
        run: |
          WHEEL=$(ls dist/uns-*.whl)
          uv pip install --python /tmp/full-install/bin/python "${WHEEL}[full]"

      - name: Confirm full install lights up every shipped package
        run: |
          /tmp/full-install/bin/python <<'PYEOF'
          import uns
          import uns.api
          import uns_mcp
          import notification
          import db
          import ui_client
          from uns.app import create_app
          from uns_mcp import create_mcp_server
          # Construct the unified app to make sure all dependency wiring resolves.
          app = create_app(skip_persistence_config=True)
          assert app.title == "UNS"
          print("Full install: all server entrypoints construct cleanly")
          PYEOF

  postgres:
    name: PostgreSQL 16 Acceptance & Load
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uns
          POSTGRES_PASSWORD: uns_test_pw
          POSTGRES_DB: uns_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install package
        run: uv pip install --system -e ".[dev]"

      - name: Run PostgreSQL acceptance & sustained load tests
        env:
          UNS_TEST_POSTGRES_URL: postgresql+psycopg://uns:uns_test_pw@localhost:5432/uns_test
        run: uv run pytest tests/uns/test_postgres_and_load.py -q

  ui:
    name: Console and Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/ci/check_ui_boundary.py --strict
      - run: npm ci && npm run ci
        working-directory: apps/ui

  ci:
    name: CI
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, test, install-smoke, postgres, ui]
    steps:
      - name: Verify all required jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint and Audit job failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test job (matrix) failed"
            exit 1
          fi
          if [ "${{ needs.install-smoke.result }}" != "success" ]; then
            echo "Clean-room wheel install job failed"
            exit 1
          fi
          if [ "${{ needs.postgres.result }}" != "success" ]; then
            echo "PostgreSQL Acceptance & Load job failed"
            exit 1
          fi
          if [ "${{ needs.ui.result }}" != "success" ]; then
            echo "Console checks failed"
            exit 1
          fi
          echo "All required jobs passed"
