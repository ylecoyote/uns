version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: widen
    ignore:
      # uns_mcp targets the FastMCP 1.x runtime API (mcp[cli]>=1.0.0,<2)
      - dependency-name: "mcp"
        versions: [">= 2.0.0"]

  - package-ecosystem: npm
    directory: /apps/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
    ignore:
      # Keep ESLint 9.x until ESLint 10 is adopted across plugins
      - dependency-name: "eslint"
        versions: [">= 10.0.0"]
      # Keep TypeScript 5.x until @typescript-eslint/parser supports TypeScript 6+/7+
      - dependency-name: "typescript"
        versions: [">= 6.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
