tasks:
  - title: Baseline scan for terminology and cross-doc consistency (minor nits)
    completed: true
    description: >
      Review the current docs set and confirm the three “minor nits” areas:

      1) Terminology consistency (e.g., "delivery pipeline" vs "delivery
      service")

      2) /health endpoint reminder placement (root README)

      3) Policy state disclaimer clarity (why document planned states)


      Confirm there are no unintended contradictions introduced since the last
      audit.

      Output:

      - docs/reports/minor-nits-baseline.md
  - title: 'Standardize terminology: "delivery pipeline" vs "delivery service"'
    completed: true
    parallel_group: 1
    description: |
      Standardize terminology across root README and deep docs.
      Prefer the term used in ARCHITECTURE/API docs for consistency.
      Update phrasing only; do not change semantics.

      Files:
      - README.md
      - docs/ARCHITECTURE.md (only if needed for alignment)
      - docs/sections/delivery-semantics.md (only if needed)

      Output:
      - PR-ready doc edits with consistent terminology
  - title: Add /health endpoint reminder to root README (optional)
    completed: true
    parallel_group: 1
    description: >
      Add a brief note in the root README indicating that:

      - GET /health is a minimal stub intended for load balancers

      - Adapter health checks are available via adapter registry
      health_check_all()

      - For monitoring semantics, refer to docs/sections/observability.md


      Keep this to 1–3 lines and link to the observability section.

      File:

      - README.md


      Output:

      - README.md updated with /health clarification
  - title: Clarify policy state disclaimer rationale (planned vs implemented)
    completed: true
    parallel_group: 1
    description: >
      In policy-lifecycle documentation, add a short rationale explaining:

      - Policy states are documented as the intended lifecycle contract

      - Current implementation treats registered policies as ACTIVE

      - The section exists to prevent future doc churn and guide implementation


      Keep it concise and clearly labeled as "Current Implementation Note" vs
      "Planned".

      File:

      - docs/sections/policy-lifecycle.md


      Output:

      - policy-lifecycle.md updated disclaimer text
  - title: "Final pass: ensure optional improvements introduce no contradictions"
    completed: true
    description: >
      Verify that the doc-only edits:

      - do not change any behavioral claims

      - do not contradict delivery semantics, observability, or architecture
      sections

      - preserve all ack/execution boundary warnings

      - keep cross-links valid


      Output:

      - docs/reports/minor-nits-final-check.md
